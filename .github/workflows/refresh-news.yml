# Daily news refresh in the cloud: fetches new articles for every stored company (RO / MD / DE / AT press
# feeds, Bing News), re-runs the signal analysis and re-scores, writing straight to MongoDB Atlas and Neon.
# Runs on GitHub's servers, so it works while the free Render instance sleeps.
# Needs the Neon and Atlas connection strings as repository secrets (Settings -> Secrets and variables -> Actions):
# either DATABASE_URL (postgresql+psycopg://...) and MONGO_URI (mongodb+srv://...), or one secret ALFA holding the
# lines of .env.render (DATABASE_URL=..., MONGO_URI=...) or .env.cloud (PG_CLOUD_URL=..., MONGO_CLOUD_URI=...).
# Atlas Network Access must allow 0.0.0.0/0.
name: Refresh news

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC (06:00 in Chisinau / Bucharest in summer)
  workflow_dispatch:       # Actions -> Refresh news -> Run workflow, to start it by hand

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # the whole 984-company refresh; GitHub cancels the job after this
    env:
      DATABASE_SCHEMA: LeadRadar
      MONGO_DB: leadradar
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional, paid; without it the free AI chain below is used
      # free AI providers, tried in this order; a key can also be a KEY=value line in ALFA
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OLLAMA_MODEL: qwen2.5:3b   # local base model on the runner, answers when every cloud quota is used up
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            pipeline/pyproject.toml
      - name: Install
        run: pip install -e pipeline -r backend/requirements.txt
      - name: Read the connection strings from the secrets
        env:
          PG_SECRET: ${{ secrets.DATABASE_URL }}
          MONGO_SECRET: ${{ secrets.MONGO_URI }}
          ALFA: ${{ secrets.ALFA }}
        run: |
          # value of KEY=... in the ALFA secret (quotes, spaces and Windows line ends removed)
          get() { printf '%s\n' "$ALFA" | tr -d '\r' | sed -n "s/^[[:space:]]*\(export[[:space:]]\+\)\?$1[[:space:]]*=[[:space:]]*//p" | head -n1 | sed "s/^[\"']//; s/[\"'][[:space:]]*$//; s/[[:space:]]*$//"; }
          pg="${PG_SECRET:-$(get DATABASE_URL)}"; pg="${pg:-$(get PG_CLOUD_URL)}"
          mongo="${MONGO_SECRET:-$(get MONGO_URI)}"; mongo="${mongo:-$(get MONGO_CLOUD_URI)}"
          pg="$(printf '%s' "$pg" | sed 's#^postgres\(ql\)\?://#postgresql+psycopg://#')"   # SQLAlchemy needs the psycopg driver
          test -n "$pg" || { echo "::error::No Neon URL: add secret DATABASE_URL, or a DATABASE_URL= / PG_CLOUD_URL= line in ALFA"; exit 1; }
          test -n "$mongo" || { echo "::error::No Atlas URL: add secret MONGO_URI, or a MONGO_URI= / MONGO_CLOUD_URI= line in ALFA"; exit 1; }
          echo "::add-mask::$pg"; echo "::add-mask::$mongo"
          { echo "DATABASE_URL=$pg"; echo "MONGO_URI=$mongo"; } >> "$GITHUB_ENV"
          for k in GEMINI_API_KEY GROQ_API_KEY MISTRAL_API_KEY OPENROUTER_API_KEY; do
            if [ -z "${!k}" ] && v="$(get $k)" && [ -n "$v" ]; then echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"; fi
          done
      - name: Start the local base model (Ollama)
        # the analysis falls back to it when Gemini, Groq, Mistral and OpenRouter are all out of quota
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          for i in $(seq 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"
      - name: Add new services and questions from the seed (existing ones stay as they are)
        working-directory: backend
        # the next step analyses and re-scores every company, new services included
        run: python -m app.seed --no-rescore
      - name: Refresh news, analyse and re-score
        working-directory: backend
        # --fresh-hours 20: a company that got news in yesterday's run is fetched again today (24 would skip it)
        run: python -m app.bootstrap --refresh-news --fresh-hours 20
