[project]
name = "sales-pipeline"
version = "0.1.0"
description = "Data collection + LangGraph signal extraction for the Orange Systems B2B sales intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "langgraph>=1.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=1.12",
  "lxml_html_clean>=0.4",  # needed by trafilatura -> justext with lxml>=5.2
  "beautifulsoup4>=4.12",
  "rapidfuzz>=3.9",
  "pypdf>=4.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sales_pipeline*"]
