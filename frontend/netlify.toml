# Netlify: build the React app from this folder. VITE_API_URL (the Render API URL) is set as a site
# environment variable, because Vite bakes it into the bundle at build time.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route (/leads/12, /admin, ...) is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
